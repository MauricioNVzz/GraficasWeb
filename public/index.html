<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Serpientes y Escaleras - Login</title>


<style>

    body {

        margin: 0;

        min-height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        font-family: Arial, sans-serif;

        background-color: #87CEEB;

    }


    .login {

        width: 350px;

        padding: 35px;

        background-color: white;

        border-radius: 15px;

        box-shadow:
            0 5px 20px
            rgba(0, 0, 0, 0.3);

    }


    h1 {

        text-align: center;

        margin-top: 0;

    }


    .subtitulo {

        text-align: center;

        margin-bottom: 25px;

        color: #555;

    }


    label {

        display: block;

        margin-top: 15px;

        margin-bottom: 5px;

    }


    input {

        width: 100%;

        box-sizing: border-box;

        padding: 11px;

        border: 1px solid #ccc;

        border-radius: 6px;

        font-size: 15px;

    }


    button {

        width: 100%;

        margin-top: 20px;

        padding: 12px;

        border: none;

        border-radius: 8px;

        background-color: #333;

        color: white;

        cursor: pointer;

        font-size: 16px;

    }


    button:hover {

        background-color: #555;

    }


    .registro {

        text-align: center;

        margin-top: 20px;

    }


    .registro a {

        color: #333;

        font-weight: bold;

    }


    #mensaje {

        margin-top: 15px;

        text-align: center;

    }

</style>
</head>

<body>

<div class="login">

    <h1>
        🐍 Serpientes y Escaleras 🪜
    </h1>

    <p class="subtitulo">
        Inicia sesión para jugar
    </p>


    <form id="formLogin">


        <label for="usuario">
            Usuario
        </label>

        <input
            type="text"
            id="usuario"
            required
        >


        <label for="password">
            Contraseña
        </label>

        <input
            type="password"
            id="password"
            required
        >


        <button type="submit">
            Iniciar sesión
        </button>


    </form>


    <div id="mensaje"></div>


    <div class="registro">

        <p>
            ¿No tienes una cuenta?
        </p>

        <a href="/registro.html">
            Crear cuenta
        </a>

    </div>

</div>


<script>


    const formulario =
        document.getElementById("formLogin");


    const mensaje =
        document.getElementById("mensaje");


    formulario.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const usuario =
                document.getElementById(
                    "usuario"
                ).value;


            const password =
                document.getElementById(
                    "password"
                ).value;


            try {


                const respuesta =
                    await fetch(
                        "/login",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                usuario,
                                password
                            })

                        }
                    );


                const datos =
                    await respuesta.json();


                mensaje.textContent =
                    datos.mensaje;


                if (respuesta.ok) {

                    // Ir al lobby
                    window.location.href =
                        "/lobby.html";

                }


            } catch (error) {

                console.error(error);


                mensaje.textContent =
                    "Error al conectar con el servidor.";

            }

        }
    );

</script>

</body>

</html>
