<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Registro</title>

<style>

    body {
        margin: 0;

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;

        background-color: #87CEEB;
    }

    .registro {
        width: 350px;

        padding: 30px;

        background-color: white;

        border-radius: 15px;

        box-shadow:
            0 5px 20px rgba(0, 0, 0, 0.3);
    }

    h1 {
        text-align: center;
    }

    label {
        display: block;

        margin-top: 15px;
        margin-bottom: 5px;
    }

    input {
        width: 100%;

        box-sizing: border-box;

        padding: 10px;

        border: 1px solid #ccc;

        border-radius: 6px;
    }

    button {
        width: 100%;

        margin-top: 20px;

        padding: 12px;

        border: none;

        border-radius: 8px;

        background-color: #333;

        color: white;

        cursor: pointer;

        font-size: 16px;
    }

    button:hover {
        background-color: #555;
    }

    #mensaje {
        margin-top: 15px;

        text-align: center;
    }

</style>

</head>

<body>

<div class="registro">

    <h1>Crear cuenta</h1>

    <form id="formRegistro">

        <label for="usuario">
            Usuario
        </label>

        <input
            type="text"
            id="usuario"
            name="usuario"
            required
        >


        <label for="correo">
            Correo
        </label>

        <input
            type="email"
            id="correo"
            name="correo"
            required
        >


        <label for="password">
            Contraseña
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >


        <button type="submit">
            Registrarse
        </button>

    </form>

    <div id="mensaje"></div>

</div>


<script>

    const formulario =
        document.getElementById("formRegistro");

    const mensaje =
        document.getElementById("mensaje");


    formulario.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const usuario =
                document.getElementById("usuario").value;

            const correo =
                document.getElementById("correo").value;

            const password =
                document.getElementById("password").value;


            try {

                const respuesta = await fetch(
                    "/registro",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            usuario,
                            correo,
                            password
                        })
                    }
                );


                const datos =
                    await respuesta.json();


                mensaje.textContent =
                    datos.mensaje;


                if (respuesta.ok) {

                    formulario.reset();

                }

            } catch (error) {

                console.error(error);

                mensaje.textContent =
                    "Error al conectar con el servidor.";

            }

        }
    );

</script>

</body>

</html>
