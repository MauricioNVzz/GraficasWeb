<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Serpientes y Escaleras</title>

    <style>

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #222;
        }

        #informacion {
            position: fixed;
            top: 10px;
            left: 10px;

            z-index: 10;

            background: rgba(255, 255, 255, 0.9);

            padding: 15px;

            border-radius: 10px;

            min-width: 220px;
        }

        #informacion h2 {
            margin-top: 0;
        }

        #juego {
            width: 100vw;
            height: 100vh;
        }

        button {
            padding: 8px 15px;
            margin-top: 10px;

            cursor: pointer;
        }

        
    #controlesJuego {
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 1000;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
    }

    #controlesJuego button {
        padding: 10px 15px;
        border: 1px solid #ffffff55;
        border-radius: 9px;
        background: #17365e;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 3px 8px #0004;
    }

    #controlesJuego button:hover {
        background: #24548a;
    }

    .fondoVentana[hidden] {
        display: none !important;
    }

    .fondoVentana {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
        background: #07142699;
        font-family: Arial, sans-serif;
    }

    .ventanaJuego {
        position: relative;
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
        padding: 28px;
        border: 2px solid #78a9d8;
        border-radius: 16px;
        background: #f5f9ff;
        color: #183453;
        text-align: center;
        box-shadow: 0 12px 40px #0005;
    }

    .ventanaJuego h2 {
        margin: 5px 0 12px;
        color: #173f70;
    }

    .ventanaJuego p {
        line-height: 1.5;
    }

    .cerrarVentana {
        position: absolute;
        top: 8px;
        right: 12px;
        border: none;
        background: transparent;
        color: #183453;
        font-size: 28px;
        cursor: pointer;
    }

    .opcionConfiguracion {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin: 20px 0;
        text-align: left;
    }

    .opcionConfiguracion input[type="range"] {
        width: 45%;
    }

    .opcionConfiguracion select {
        padding: 7px;
        border: 1px solid #b6c9df;
        border-radius: 6px;
    }

    .opcionConfiguracion input[type="checkbox"] {
        margin-right: 6px;
    }

    .opcionesPausa {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 22px;
    }

    .botonPrincipal,
    .botonSecundario {
        padding: 11px 15px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
    }

    .botonPrincipal {
        background: #245a91;
        color: white;
    }

    .botonSecundario {
        background: #dce8f5;
        color: #183453;
    }

    .botonPrincipal:hover {
        background: #173f70;
    }

    .botonSecundario:hover {
        background: #c4d9ef;
    }

    .notaVentana {
        margin-top: 18px;
        color: #64758a;
        font-size: 12px;
    }

    @media (max-width: 480px) {
        #controlesJuego {
            top: 8px;
            right: 8px;
            gap: 6px;
        }

        #controlesJuego button {
            padding: 8px 10px;
            font-size: 12px;
        }

        .ventanaJuego {
            padding: 24px 18px;
        }
    }

    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

</head>

<body>

    <div id="informacion">

        <h2>Serpientes y Escaleras</h2>

        <p id="mensaje">
            Cargando partida...
        </p>

        <p id="partida"></p>

        <p id="usuario"></p>

        <button id="volverLobby">
            Volver al lobby
        </button>

        <button id="lanzarDado">Lanzar dado</button>

    </div>


    <div id="juego"></div>

    
<!-- Configuracion y Pausa -->
<div id="controlesJuego">
    <button id="btnConfiguracion" type="button">
        ⚙ Configuración
    </button>

    <button id="btnPausa" type="button">
        ⏸ Pausa
    </button>
</div>

<div id="ventanaConfiguracion" class="fondoVentana" hidden>
    <div class="ventanaJuego">
        <button class="cerrarVentana"
                data-cerrar="ventanaConfiguracion"
                type="button">×</button>

        <h2>Configuración</h2>
        <p>Personaliza tu experiencia de juego.</p>

        <div class="opcionConfiguracion">
            <label for="volumenJuego">Volumen</label>
            <input id="volumenJuego"
                   type="range" min="0" max="100" value="70">
        </div>

        <div class="opcionConfiguracion">
            <label for="calidadJuego">Calidad gráfica</label>
            <select id="calidadJuego">
                <option value="baja">Baja</option>
                <option value="media" selected>Media</option>
                <option value="alta">Alta</option>
            </select>
        </div>

        <div class="opcionConfiguracion">
            <label>
                <input type="checkbox" checked>
                Mostrar efectos visuales
            </label>
        </div>

        <button class="botonSecundario"
                data-cerrar="ventanaConfiguracion"
                type="button">
            Cerrar
        </button>
    </div>
</div>
}
<div id="ventanaPausa" class="fondoVentana" hidden>
    <div class="ventanaJuego">
        <button class="cerrarVentana"
                data-cerrar="ventanaPausa"
                type="button">×</button>

        <h2>Juego en pausa</h2>

        <div class="opcionesPausa">
            <button class="botonPrincipal"
                    data-cerrar="ventanaPausa"
                    type="button">
                Continuar
            </button>

            <button class="botonSecundario" type="button">
                Reiniciar partida
            </button>

            <button class="botonSecundario" type="button">
                Salir al lobby
            </button>
        </div>

        <p class="notaVentana">
           opciones
        </p>
    </div>
</div>

<script>
    // Ventanas
    document.getElementById("btnConfiguracion")
        .addEventListener("click", () => {
            document.getElementById(
                "ventanaConfiguracion"
            ).hidden = false;
        });

    document.getElementById("btnPausa")
        .addEventListener("click", () => {
            document.getElementById(
                "ventanaPausa"
            ).hidden = false;
        });

    document.querySelectorAll("[data-cerrar]")
        .forEach(boton => {
            boton.addEventListener("click", () => {
                const idVentana = boton.dataset.cerrar;

                document.getElementById(idVentana).hidden = true;
            });
        });
</script>

    <script src="/socket.io/socket.io.js"></script>

    <script type="module">

import * as THREE from "three";

// Socket.io y Partida

const socket = io();

const parametros =
    new URLSearchParams(window.location.search);

const partidaId =
    Number(parametros.get("partida"));

let usuarioActual = null;
let miUsuarioId = null;
let soyJugador1 = false;
let soyJugador2 = false;

async function entrarAPartida() {

    try {

        const respuesta =
            await fetch("/sesion");

        const datos =
            await respuesta.json();

        if (!datos.autenticado) {

            window.location.href = "/";

            return;
        }

        usuarioActual =
            datos.usuario;

        miUsuarioId =
            usuarioActual.id;

        document
            .getElementById("usuario")
            .textContent =
            "Usuario: " +
            usuarioActual.usuario;

        document
            .getElementById("partida")
            .textContent =
            "Partida: " +
            partidaId;

        console.log(
            "Usuario actual:",
            usuarioActual
        );

        console.log(
            "ID de partida:",
            partidaId
        );

        socket.emit(
            "entrarPartida",
            {
                partidaId: partidaId,
                usuarioId: miUsuarioId
            }
        );

    } catch (error) {

        console.error(
            "Error al entrar a la partida:",
            error
        );

    }
}

socket.on(
    "estadoInicial",
    function (datos) {

        console.log(
            "Estado inicial recibido:",
            datos
        );

        if (
            datos.miUsuarioId ===
            datos.jugador1Id
        ) {

            soyJugador1 = true;
            soyJugador2 = false;

            console.log(
                "Jugador 1"
            );

        } else if (
            datos.miUsuarioId ===
            datos.jugador2Id
        ) {

            soyJugador1 = false;
            soyJugador2 = true;

            console.log(
                "Jugador 2"
            );
        }

        // Posiciones

        casillaJugador1 =
            datos.posicionJugador1;

        casillaJugador2 =
            datos.posicionJugador2;

        // Turnos

        if (
            datos.turno ===
            datos.jugador1Id
        ) {

            turnoActual = 1;

        } else {

            turnoActual = 2;
        }

        // Modelos

        if (jugador1) {

            colocarEnCasilla(
                jugador1,
                casillaJugador1
            );
        }

        if (jugador2) {

            colocarEnCasilla(
                jugador2,
                casillaJugador2
            );
        }


        actualizarTurno();
        actualizarBotonDado();

    }
);

socket.on(
    "estadoPartida",
    async function (datos) {

        console.log(
            "Estado de partida recibido:",
            datos
        );

        if (datos.partidaId !== partidaId) {
            return;
        }

        // Guardamos las posiciones que vienen del servidor
        const nuevaPosicionJugador1 =
            datos.posicionJugador1;

        const nuevaPosicionJugador2 =
            datos.posicionJugador2;

        // Movimiento

        if (
            jugador1 &&
            nuevaPosicionJugador1 !== casillaJugador1
        ) {

            const cantidad =
                nuevaPosicionJugador1 -
                casillaJugador1;

            casillaJugador1 =
                await moverJugador(
                    jugador1,
                    casillaJugador1,
                    cantidad
                );
        }

        if (
            jugador2 &&
            nuevaPosicionJugador2 !== casillaJugador2
        ) {

            const cantidad =
                nuevaPosicionJugador2 -
                casillaJugador2;

            casillaJugador2 =
                await moverJugador(
                    jugador2,
                    casillaJugador2,
                    cantidad
                );
        }

        if (
            datos.turno ===
            datos.jugador1Id
        ) {

            turnoActual = 1;

        } else {

            turnoActual = 2;
        }


        console.log(
            "Nuevo turno:",
            turnoActual
        );

        moviendoJugador = false;

if (datos.finalizada) {

    const mensaje =
        document.getElementById("mensaje");

    if (datos.ganador === miUsuarioId) {

        mensaje.textContent =
            "Felicidades has ganado! :)";

    } else {

        mensaje.textContent =
            "Lastima, has perdido :(";

    }

    const boton =
        document.getElementById("lanzarDado");

    if (boton) {

        boton.disabled = true;

        boton.textContent =
            "Game Over";
    }

    return;
}


actualizarTurno();
actualizarBotonDado();

    }
);
import { GLTFLoader } from
    "three/addons/loaders/GLTFLoader.js";

import { OrbitControls } from
    "three/addons/controls/OrbitControls.js";

// Escena

const escena =
    new THREE.Scene();

escena.background =
    new THREE.Color(0x87ceeb);

// Camara

const camara =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );

camara.position.set(
    0,
    15,
    20
);

camara.lookAt(
    0,
    0,
    0
);

// Render

const renderizador =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderizador.setSize(
    window.innerWidth,
    window.innerHeight
);

renderizador.setPixelRatio(
    window.devicePixelRatio
);

document
    .getElementById("juego")
    .appendChild(
        renderizador.domElement
    );

// Camara Controls

const controles =
    new OrbitControls(
        camara,
        renderizador.domElement
    );

controles.target.set(
    0,
    0,
    0
);

controles.update();

// Luces Ambient, Directional y Focal

const luzAmbiente =
    new THREE.AmbientLight(
        0xffffff,
        0.5
    );

escena.add(
    luzAmbiente
);


const luzDireccional =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

luzDireccional.position.set(
    5,
    15,
    10
);

escena.add(
    luzDireccional
);

const luzFocal = new THREE.SpotLight(
    0xffffff,
    150,
    40,
    Math.PI / 5,
    0.4,
    2
);

luzFocal.position.set(0, 12, 0);

luzFocal.target.position.set(0, 0, 0);

escena.add(luzFocal);
escena.add(luzFocal.target);

luzFocal.castShadow = true;

const loader =
    new GLTFLoader();


// Variables del juego

let mesa = null;

let tablero = null;

let jugador1 = null;

let jugador2 = null;

let dado = null;

let casillaJugador1 = 1;
let casillaJugador2 = 1;

let turnoActual = 1;
let moviendoJugador = false;

// =====================================================
// FUNCIÓN PARA MOSTRAR INFORMACIÓN DEL MODELO
// =====================================================

function revisarModelo(
    nombre,
    modelo
) {

    const caja =
        new THREE.Box3()
            .setFromObject(
                modelo
            );

    const tamaño =
        caja.getSize(
            new THREE.Vector3()
        );

    const centro =
        caja.getCenter(
            new THREE.Vector3()
        );
}


loader.load(

    "/modelos/Mesagcw.glb",

    function (gltf) {

        mesa = gltf.scene;

escena.add(mesa);

console.log(
    "MESA CARGADA CORRECTAMENTE"
);

// Agrandar la mesa
mesa.scale.set(
    4.5,
    4.5,
    4.5
);

mesa.updateMatrixWorld(true);

const cajaMesa =
    new THREE.Box3()
        .setFromObject(mesa);

const centroMesa =
    cajaMesa.getCenter(
        new THREE.Vector3()
    );

const tamañoMesa =
    cajaMesa.getSize(
        new THREE.Vector3()
    );

// Alinear el centro de la mesa

mesa.position.x =
    -0.1510093 - centroMesa.x;

mesa.position.z =
    -0.1079885 - centroMesa.z;

mesa.updateMatrixWorld(true);

const cajaMesaFinal =
    new THREE.Box3()
        .setFromObject(mesa);


// Altura Y del Tablero

const alturaBaseTablero = 0.274;


// Colocar Mesa

mesa.position.y +=
    alturaBaseTablero -
    cajaMesaFinal.max.y -
    0.05;

cargarTablero();

    }

);

function cargarTablero() {

    loader.load(

        "/modelos/Tablerogcw.glb",

        function (gltf) {

            tablero =
                gltf.scene;

            // Girar el tablero 180° sobre el eje Y
            tablero.rotation.y = Math.PI;

            escena.add(
                tablero
            );

            revisarModelo(
                "Tablero",
                tablero
            );

            cargarJugador1();

        },

        undefined

    );

}

// Cargar Jugadores

function cargarJugador1() {

    loader.load(

        "/modelos/Jugador1gcw.glb",

        function (gltf) {

            jugador1 =
                gltf.scene;

            escena.add(
                jugador1
            );

            revisarModelo(
                "Jugador 1",
                jugador1
            );


            colocarEnCasilla(jugador1, 1);


            cargarJugador2();

        },

        undefined

    );

}

function cargarJugador2() {

    loader.load(

        "/modelos/Jugador2gcw.glb",

        function (gltf) {

            jugador2 =
                gltf.scene;

            escena.add(
                jugador2
            );

            revisarModelo(
                "Jugador 2",
                jugador2
            );


            colocarEnCasilla(jugador2, 1);

            cargarDado();

        },

        undefined

    );

}

// Posiciones de las casillas

const posicionesCasillas = {};

// Posiciones casilla 1 (Inicio) y 100 (Final)

const xInicio = -5.505;
const xFinal = 6.055;

const zInicio = 6.00;
const zFinal = -5.50;

// Posiciones Eje Z || Fila

const posicionesZ = [
    6.00,   // Fila 1
    4.70,   // Fila 2
    3.50,   // Fila 3
    2.20,   // Fila 4
    0.90,   // Fila 5
   -0.40,   // Fila 6
   -1.70,   // Fila 7
   -3.00,   // Fila 8
   -4.20,   // Fila 9
   -5.50    // Fila 10
];

// Posiciones Eje X || Columna

const posicionesX = [
    -5.505,  // Columna 1
    -4.205,  // Columna 2
    -2.905,  // Columna 3
    -1.605,  // Columna 4
    -0.305,  // Columna 5
     0.995,  // Columna 6
     2.295,  // Columna 7
     3.595,  // Columna 8
     4.895,  // Columna 9
     6.055   // Columna 10
];

for (let numero = 1; numero <= 100; numero++) {

    // Fila de la casilla
    const fila =
        Math.floor((numero - 1) / 10);

    // Posición dentro de la fila
    const posicionFila =
        (numero - 1) % 10;

    let columna;

    if (fila % 2 === 0) {

        // Fila 1, 3, 5, etc.
        columna = posicionFila;

    } else {

        // Fila 2, 4, 6, etc.
        columna = 9 - posicionFila;

    }


    // Coordenadas
    const x =
        posicionesX[columna];

    const z =
        posicionesZ[fila];


    posicionesCasillas[numero] = [
        x,
        0.5,
        z
    ];
}

// Esquinas del Tablero

posicionesCasillas[1] =
    [-5.505, 0.5, 6.00];

posicionesCasillas[10] =
    [6.055, 0.5, 6.00];

posicionesCasillas[91] =
    [6.055, 0.5, -5.50];

posicionesCasillas[100] =
    [-5.505, 0.5, -5.50];

// Colocar Jugadores

function colocarEnCasilla(
    jugador,
    numero
) {

    const posicion =
        posicionesCasillas[numero];

    jugador.position.set(
        posicion[0],
        posicion[1],
        posicion[2]
    );

}

async function moverJugador(jugador, casillaActual, cantidad) {

    let nuevaCasilla = casillaActual + cantidad;

    // Límites del tablero
    if (nuevaCasilla > 100) {
        nuevaCasilla = 100;
    }

    if (nuevaCasilla < 1) {
        nuevaCasilla = 1;
    }

    const direccion =
        nuevaCasilla > casillaActual ? 1 : -1;

    for (
        let casilla = casillaActual + direccion;
        direccion === 1
            ? casilla <= nuevaCasilla
            : casilla >= nuevaCasilla;
        casilla += direccion
    ) {

        colocarEnCasilla(jugador, casilla);

        await new Promise(
            resolver => setTimeout(resolver, 400)
        );
    }

    return nuevaCasilla;
}

function actualizarBotonDado() {

    const boton =
        document.getElementById("lanzarDado");

    if (!boton) {
        return;
    }

    const esMiTurno =
        (soyJugador1 && turnoActual === 1) ||
        (soyJugador2 && turnoActual === 2);

    if (esMiTurno && !moviendoJugador) {

        boton.disabled = false;

        boton.textContent =
            "Lanza el dado";

    } else {

        boton.disabled = true;

        boton.textContent =
            "Esperando al otro jugador";
    }
}

async function lanzarDado() {

    moviendoJugador = true;

    actualizarBotonDado();

    socket.emit(
        "lanzarDado",
        {
            partidaId: partidaId,
            usuarioId: miUsuarioId
        }
    );
}

function actualizarTurno() {

    const mensaje =
        document.getElementById("mensaje");

    if (turnoActual === 1) {

        mensaje.textContent =
            "Turno del Jugador 1";

    } else {

        mensaje.textContent =
            "Turno del Jugador 2";
    }
}

function cargarDado() {

    loader.load(

        "/modelos/Dadogcw.glb",

        function (gltf) {

            dado =
                gltf.scene;

            escena.add(
                dado
            );

            revisarModelo(
                "Dado",
                dado
            );


            dado.scale.set(
    0.5,
    0.5,
    0.5
);

dado.position.set(
    7,
    1,
    0
);

        },

        undefined

    );

}

function animar() {

    requestAnimationFrame(
        animar
    );

    controles.update();

    renderizador.render(
        escena,
        camara
    );

}

animar();

        window.addEventListener(
            "resize",
            function () {

                camara.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camara.updateProjectionMatrix();


                renderizador.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );

        document
            .getElementById("volverLobby")
            .addEventListener(
                "click",
                function () {

                    window.location.href =
                        "/lobby.html";

                }
            );

            document
    .getElementById("lanzarDado")
    .addEventListener(
        "click",
        lanzarDado
    );

    entrarAPartida();

    </script>

</body>

</html>
